name: Build APK (TWA)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nombre de versión del APK (ej. 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Resolver versión
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/apk-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/apk-v}"
          else
            NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generar proyecto Android (Bubblewrap)
        working-directory: twa
        run: |
          npm ci
          node generate.mjs "${{ steps.ver.outputs.code }}" "${{ steps.ver.outputs.name }}"

      - name: Compilar APK sin firmar
        working-directory: twa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64 (ver twa/README.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > civic-obd.keystore
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=twa/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks civic-obd.keystore --ks-key-alias civic-key \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out Civic-OBD-Scanner.apk aligned.apk
          "$BT/apksigner" verify --print-certs Civic-OBD-Scanner.apk
          rm -f civic-obd.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Civic-OBD-Scanner-${{ steps.ver.outputs.name }}
          path: Civic-OBD-Scanner.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.ver.outputs.name }}
          name: Civic OBD APK ${{ steps.ver.outputs.name }}
          files: Civic-OBD-Scanner.apk
          body: |
            APK TWA de Civic OBD. Se instala una sola vez: el contenido se actualiza solo
            desde https://fedelt01hub.github.io/civic-obd/ mediante el Service Worker.
