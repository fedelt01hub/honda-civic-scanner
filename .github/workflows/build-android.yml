name: Build APK (Capacitor)

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm test
      - run: npm run sync

      - name: Compilar APK firmado
        env:
          KEYSTORE_BASE64: ${{ secrets.KLINO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KLINO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta el secret KLINO_KEYSTORE_BASE64 (ver android-app/README.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/klino.jks
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          rm -f app/klino.jks

      - name: Verificar firma y nombrar
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          VER="${GITHUB_REF_NAME#android-v}"
          cp android/app/build/outputs/apk/release/app-release.apk "K-Lino-${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: K-Lino-apk
          path: android-app/K-Lino-*.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/K-Lino-*.apk
