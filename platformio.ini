[platformio]
src_dir = .
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
; src_dir = . compilaría también los tests y la app: excluirlos del firmware
build_src_filter = +<*> -<.git/> -<.pio/> -<test/> -<twa/> -<app/>
upload_port = /dev/ttyACM0
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Tests de lógica pura en la PC: pio test -e native
[env:native]
platform = native
build_flags = -I. -std=gnu++17
test_build_src = no
